<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Forecasting Report (Gantt View)</title>
<style>
  :root {
    --bg: #FAFBFC;
    --panel: #FFFFFF;
    --border: #E4E8EE;
    --border-strong: #D3D9E2;
    --text: #1F2933;
    --text-muted: #6B7280;
    --accent: #2F5FA3;
    --accent-dark: #1B3B6F;
    --accent-light: #C7D9F0;
    --orange: #C1560C;
    --status-inprogress: #2F80ED;
    --status-completed: #219653;
    --status-onhold: #DE8A1C;
    --row-h: 30px;
    --month-w: 34px;
    --c-primary: 230px;
    --c-client: 150px;
    --c-id: 100px;
    --c-status: 108px;
    --c-end: 95px;
    --c-fab: 100px;
    --c-ship: 100px;
    --c-pct: 78px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .banner {
    background: linear-gradient(90deg, #E2EFDA 0%, #DCEAD6 100%);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-strong);
    flex-shrink: 0;
  }
  .banner h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar input[type="text"] {
    padding: 7px 12px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; width: 240px; outline: none; font-family: inherit;
  }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }
  .toolbar select {
    padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: white; outline: none;
  }
  .toolbar .count { margin-left: auto; font-size: 12px; color: var(--text-muted); }
  .legend { display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--text-muted); }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .grid-wrap { flex: 1; overflow: auto; position: relative; background: var(--panel); }

  .gantt-grid {
    display: grid;
    grid-template-columns:
      var(--c-primary) var(--c-client) var(--c-id) var(--c-status) var(--c-end) var(--c-fab) var(--c-ship) var(--c-pct)
      repeat(var(--n-months), var(--month-w));
    grid-template-rows: 22px 22px;
    grid-auto-rows: var(--row-h);
    width: max-content;
  }

  .cell {
    display: flex; align-items: center;
    padding: 0 10px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--panel);
  }
  .cell.id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; }

  /* Sticky left columns (apply to every row's first 7 cells) */
  .sticky-col {
    position: sticky;
    z-index: 2;
    background: var(--panel);
  }
  .col-0 { left: 0; }
  .col-1 { left: var(--c-primary); }
  .col-2 { left: calc(var(--c-primary) + var(--c-client)); }
  .col-3 { left: calc(var(--c-primary) + var(--c-client) + var(--c-id)); }
  .col-4 { left: calc(var(--c-primary) + var(--c-client) + var(--c-id) + var(--c-status)); }
  .col-5 { left: calc(var(--c-primary) + var(--c-client) + var(--c-id) + var(--c-status) + var(--c-end)); }
  .col-6 { left: calc(var(--c-primary) + var(--c-client) + var(--c-id) + var(--c-status) + var(--c-end) + var(--c-fab)); }
  .col-7 { left: calc(var(--c-primary) + var(--c-client) + var(--c-id) + var(--c-status) + var(--c-end) + var(--c-fab) + var(--c-ship)); }
  .col-7 { border-right: 2px solid var(--border-strong); }

  /* Sticky header rows */
  .head {
    position: sticky;
    z-index: 4;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 11px;
    line-height: 1.25;
    border-bottom: 1px solid var(--accent-dark);
    align-items: center;
    white-space: normal;
  }
  .head.sticky-col { z-index: 6; top: 0; }
  .head.year-head {
    top: 0;
    background: #F2F2F2;
    color: #1F2933;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
    border-left: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
  }
  .head.month-head {
    top: 22px;
    background: #F8F8F8;
    color: var(--orange);
    justify-content: center;
    font-weight: 700;
    font-size: 10px;
    border-left: 1px solid var(--border);
  }

  .row-alt .cell { background: #FBFCFD; }
  .row-hover:hover .cell { background: #EEF3FA; }
  .row-hover:hover .timeline { background: #F5F8FC; }

  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; }
  .status-inprogress { background: #E4EEFC; color: var(--status-inprogress); }
  .status-completed  { background: #E1F3E8; color: var(--status-completed); }
  .status-onhold     { background: #FCEEDC; color: var(--status-onhold); }

  .timeline {
    position: relative;
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
    grid-column: 9 / span var(--n-months);
    background: repeating-linear-gradient(
      to right, transparent, transparent calc(var(--month-w) - 1px),
      var(--border) calc(var(--month-w) - 1px), var(--border) var(--month-w)
    );
  }
  .bar-track {
    position: absolute; top: 6px; height: 18px; border-radius: 5px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08); background: var(--accent-light);
  }
  .bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); }
  .bar-track.overflow::after {
    content: "\2192"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    color: white; font-size: 11px; font-weight: 700;
  }

  .tooltip {
    position: fixed; background: #1F2933; color: white; font-size: 11.5px; padding: 8px 10px;
    border-radius: 6px; pointer-events: none; z-index: 50; display: none; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); max-width: 240px;
  }
  .tooltip b { color: #A9C6F5; }
</style>
</head>
<body>
<div id="app">
  <div class="banner">
    <h1>Portfolio Forecasting Report (Gantt View)</h1>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search project name, client, or ID&hellip;">
    <select id="statusFilter"><option value="">All statuses</option></select>
    <div class="legend">
      <span><span class="swatch" style="background:var(--accent-dark)"></span>Completed progress</span>
      <span><span class="swatch" style="background:var(--accent-light)"></span>Remaining work</span>
    </div>
    <div class="count" id="rowCount"></div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="gantt-grid" id="ganttGrid"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const MONTH_W = 34;

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ if(!s) return 'N/A'; const dt=parseDate(s); return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+String(dt.getFullYear()).slice(2); }
function daysBetween(a,b){ return (b-a)/86400000; }
function monthShort(m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]; }

const rows = DATA.filter(r => r.endDate);
const fabStarts = rows.map(r=>r.fabStart).filter(Boolean).map(parseDate);
const endDates = rows.map(r=>r.endDate).filter(Boolean).map(parseDate);
const minStartYear = fabStarts.length ? Math.min(...fabStarts.map(d=>d.getFullYear())) : new Date().getFullYear();
const maxEndDate = new Date(Math.max(...endDates));
const windowStart = new Date(minStartYear, 0, 1);
let monthsNeeded = (maxEndDate.getFullYear()-windowStart.getFullYear())*12 + (maxEndDate.getMonth()-windowStart.getMonth()) + 2;
monthsNeeded = (Math.floor(monthsNeeded/12)+1)*12;
const WINDOW_MONTHS = Math.min(monthsNeeded, 48);
const windowEnd = new Date(windowStart.getFullYear(), windowStart.getMonth()+WINDOW_MONTHS, 0);
const totalDays = daysBetween(windowStart, windowEnd);
const totalWidth = WINDOW_MONTHS * MONTH_W;

document.documentElement.style.setProperty('--n-months', WINDOW_MONTHS);

const grid = document.getElementById('ganttGrid');

const FIXED_COLS = [
  {key:'name', label:'Primary'},
  {key:'client', label:'Client'},
  {key:'id', label:'Project ID'},
  {key:'status', label:'Project Status'},
  {key:'endDate', label:'Target End Date'},
  {key:'fabStart', label:'Target Fabrication Start Date'},
  {key:'shipDate', label:'Target Shipping Date'},
  {key:'pctComplete', label:'% Complete'},
];

function addCell(text, classes, parent){
  const d = document.createElement('div');
  d.className = classes;
  if (text !== undefined && text !== null) d.textContent = text;
  parent.appendChild(d);
  return d;
}

// Header rows
FIXED_COLS.forEach((c,i)=>{
  const el = addCell(c.label, 'cell head sticky-col col-'+i, grid);
  el.style.gridRow = '1 / span 2';
});

// Year row (row 1): merged per calendar-year block
let mm = 0;
while (mm < WINDOW_MONTHS) {
  const year = windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm)/12);
  let span = 0;
  while (mm+span < WINDOW_MONTHS && (windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm+span)/12)) === year) span++;
  const startCol = 9 + mm; // 1-indexed grid column; 8 fixed cols before timeline starts at col 9
  const yEl = addCell(year, 'cell head year-head', grid);
  yEl.style.gridRow = '1';
  yEl.style.gridColumn = startCol + ' / span ' + span;
  mm += span;
}

// Month row (row 2): individual months
for (let i=0;i<WINDOW_MONTHS;i++){
  const monDate = new Date(windowStart.getFullYear(), windowStart.getMonth()+i, 1);
  const mEl = addCell(monthShort(monDate.getMonth()), 'cell head month-head', grid);
  mEl.style.gridRow = '2';
  mEl.style.gridColumn = (9+i);
}
const HEADER_CELL_COUNT = grid.children.length;

// Status filter options
const statuses = Array.from(new Set(rows.map(r=>(r.status||'').trim()).filter(Boolean)));
const statusSel = document.getElementById('statusFilter');
statuses.forEach(s=>{
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  statusSel.appendChild(opt);
});

function statusClass(status){
  const s = (status||'').trim().toLowerCase();
  if (s === 'completed') return 'status-completed';
  if (s === 'on hold') return 'status-onhold';
  return 'status-inprogress';
}

const tooltip = document.getElementById('tooltip');

function render(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const statusVal = statusSel.value;

  // remove all rows after the header
  while (grid.children.length > HEADER_CELL_COUNT) grid.removeChild(grid.lastChild);

  let shown = 0;
  rows.forEach((r, idx)=>{
    if (q && !(r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || (r.client||'').toLowerCase().includes(q))) return;
    if (statusVal && (r.status||'').trim() !== statusVal) return;
    shown++;
    const altClass = shown % 2 === 0 ? ' row-alt' : '';

    const nameCell = addCell(r.name, 'cell sticky-col col-0 row-hover'+altClass, grid);
    nameCell.title = r.name;
    addCell(r.client || '\u2014', 'cell sticky-col col-1 row-hover'+altClass, grid);
    addCell(r.id, 'cell id sticky-col col-2 row-hover'+altClass, grid);

    const statusCell = addCell(null, 'cell sticky-col col-3 row-hover'+altClass, grid);
    const pill = document.createElement('span');
    pill.className = 'status-pill ' + statusClass(r.status);
    pill.textContent = (r.status||'').trim() || '\u2014';
    statusCell.appendChild(pill);

    addCell(fmtDate(r.endDate), 'cell sticky-col col-4 row-hover'+altClass, grid);
    addCell(r.fabStart ? fmtDate(r.fabStart) : 'N/A', 'cell sticky-col col-5 row-hover'+altClass, grid);
    addCell(r.shipDate ? fmtDate(r.shipDate) : 'N/A', 'cell sticky-col col-6 row-hover'+altClass, grid);
    addCell(r.pctComplete!=null ? Math.round(r.pctComplete*100)+'%' : '\u2014', 'cell sticky-col col-7 row-hover'+altClass, grid);

    const timeline = document.createElement('div');
    timeline.className = 'timeline row-hover'+altClass;
    timeline.style.gridRow = 'span 1';

    if (r.fabStart && r.endDate){
      const start = parseDate(r.fabStart);
      const end = parseDate(r.endDate);
      const left = Math.max(0, daysBetween(windowStart, start) / totalDays * totalWidth);
      let width = daysBetween(start, end) / totalDays * totalWidth;
      width = Math.max(width, 3);
      const isOverflow = end > windowEnd;

      const track = document.createElement('div');
      track.className = 'bar-track' + (isOverflow ? ' overflow' : '');
      track.style.left = left + 'px';
      track.style.width = Math.min(width, totalWidth - left) + 'px';

      const pct = r.pctComplete != null ? r.pctComplete : 0;
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = (pct*100) + '%';
      track.appendChild(fill);

      track.addEventListener('mousemove', (e)=>{
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
        tooltip.innerHTML = '<b>'+r.name+'</b><br>'+r.id+'<br>'
          + (r.client ? 'Client: '+r.client+'<br>' : '')
          + 'Fab Start: '+fmtDate(r.fabStart)+'<br>'
          + 'Ship: '+(r.shipDate?fmtDate(r.shipDate):'N/A')+'<br>'
          + 'End: '+fmtDate(r.endDate)+'<br>'
          + '% Complete: '+(r.pctComplete!=null?Math.round(r.pctComplete*100)+'%':'\u2014');
      });
      track.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });

      timeline.appendChild(track);
    }
    grid.appendChild(timeline);
  });

  document.getElementById('rowCount').textContent = shown + ' of ' + rows.length + ' projects';
}

document.getElementById('searchBox').addEventListener('input', render);
statusSel.addEventListener('change', render);
render();
</script>
