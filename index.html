<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Forecasting Report (Gantt View)</title>
<style>
  :root {
    --bg: #FAFBFC;
    --panel: #FFFFFF;
    --border: #E4E8EE;
    --border-strong: #D3D9E2;
    --text: #1F2933;
    --text-muted: #6B7280;
    --accent: #2F5FA3;
    --accent-dark: #1B3B6F;
    --accent-light: #C7D9F0;
    --orange: #C1560C;
    --status-inprogress: #2F80ED;
    --status-completed: #219653;
    --status-onhold: #DE8A1C;
    --row-h: 30px;
    --month-w: 34px;
    --header-h: 44px;
    --fl0: 0px; --fl1: 190px; --fl2: 295px; --fl3: 380px; --fl4: 472px; --fl5: 547px; --fl6: 625px; --fl7: 703px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .banner {
    background: linear-gradient(90deg, #E2EFDA 0%, #DCEAD6 100%);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-strong);
    flex-shrink: 0;
  }
  .banner h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar input[type="text"] {
    padding: 7px 12px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; width: 240px; outline: none; font-family: inherit;
  }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }
  .toolbar select {
    padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: white; outline: none;
  }
  .toolbar .count { margin-left: auto; font-size: 12px; color: var(--text-muted); }
  .legend { display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--text-muted); }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* ===== Single scrollable grid, frozen columns via position:sticky ===== */
  .scroll-wrap { flex: 1; overflow: auto; position: relative; background: var(--panel); }
  .scroll-wrap::-webkit-scrollbar { width: 16px; height: 16px; }
  .scroll-wrap::-webkit-scrollbar-track { background: #E4E8EE; }
  .scroll-wrap::-webkit-scrollbar-thumb { background: #8A96A6; border-radius: 8px; border: 3px solid #E4E8EE; }
  .scroll-wrap::-webkit-scrollbar-thumb:hover { background: #6B7684; }
  .scroll-wrap::-webkit-scrollbar-corner { background: #E4E8EE; }
  .scroll-wrap { scrollbar-width: auto; scrollbar-color: #8A96A6 #E4E8EE; }

  .mega-grid {
    display: grid;
    grid-template-rows: 22px 22px;
    grid-auto-rows: var(--row-h);
    width: max-content;
  }

  .cell {
    display: flex; align-items: center;
    padding: 0 10px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--panel);
  }
  .cell.id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; }

  /* Frozen (sticky-left) columns 0..7 */
  .frozen { position: sticky; z-index: 2; border-right: 1px solid var(--border); }
  .fc0 { left: var(--fl0); } .fc1 { left: var(--fl1); } .fc2 { left: var(--fl2); } .fc3 { left: var(--fl3); }
  .fc4 { left: var(--fl4); } .fc5 { left: var(--fl5); } .fc6 { left: var(--fl6); } .fc7 { left: var(--fl7); border-right: 2px solid var(--border-strong); }

  .head {
    position: sticky;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 11px;
    line-height: 1.25;
    border-bottom: 1px solid var(--accent-dark);
    align-items: center;
    white-space: normal;
    overflow: hidden;
    min-width: 0;
  }
  .head.frozen-head { top: 0; grid-row: 1 / span 2; z-index: 7; border-right: 1px solid rgba(255,255,255,0.2); }
  .head.frozen-head.fc7 { border-right: 2px solid var(--accent-dark); }
  .head.year-head {
    top: 0; grid-row: 1; z-index: 5;
    background: #F2F2F2; color: #1F2933;
    justify-content: center; font-weight: 700; font-size: 11px;
    border-left: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
  }
  .head.month-head {
    top: 22px; grid-row: 2; z-index: 5;
    background: #F8F8F8; color: var(--orange);
    justify-content: center; font-weight: 700; font-size: 10px;
    border-left: 1px solid var(--border);
  }

  .col-resizer {
    position: absolute; top: 0; right: -4px; width: 9px; height: 100%; cursor: col-resize;
    background: transparent; z-index: 8; touch-action: none;
  }
  .col-resizer::after {
    content: ''; position: absolute; top: 15%; left: 50%; width: 2px; height: 70%;
    background: rgba(255,255,255,0.55); transform: translateX(-50%);
  }
  .col-resizer:hover::after, .col-resizer.resizing::after { background: #FFD97D; width: 3px; }
  .col-resizer:hover, .col-resizer.resizing { background: rgba(255,255,255,0.12); }

  /* Master divider: drags the WHOLE frozen table block, scaling all 8 columns together,
     so it can be pulled fully left (collapse the table, reveal the full chart) or
     fully right (collapse/cover the chart, let the table fill the view). */
  .master-resizer { width: 14px; right: -7px; z-index: 9; }
  .master-resizer::after { width: 3px; background: rgba(255,255,255,0.75); }
  .master-resizer:hover::after, .master-resizer.resizing::after { background: #FFD97D; width: 4px; }
  .master-resizer:hover, .master-resizer.resizing { background: rgba(255,255,255,0.22); }

  .row-alt .cell { background: #FBFCFD; }
  .row-alt.timeline { background: #FBFCFD; }

  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; }
  .status-inprogress { background: #E4EEFC; color: var(--status-inprogress); }
  .status-completed  { background: #E1F3E8; color: var(--status-completed); }
  .status-onhold     { background: #FCEEDC; color: var(--status-onhold); }

  .timeline {
    position: relative;
    border-bottom: 1px solid var(--border);
    background: repeating-linear-gradient(
      to right, transparent, transparent calc(var(--month-w) - 1px),
      var(--border) calc(var(--month-w) - 1px), var(--border) var(--month-w)
    );
  }
  .bar-track {
    position: absolute; top: 6px; height: 18px; border-radius: 5px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08); background: var(--accent-light); cursor: default;
  }
  .bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); }
  .bar-track.overflow::after {
    content: "\2192"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    color: white; font-size: 11px; font-weight: 700;
  }
  .bar-name-label {
    position: absolute; top: 6px; height: 18px; line-height: 18px;
    font-size: 10.5px; color: var(--text); white-space: nowrap;
    pointer-events: none; font-weight: 500;
  }

  /* Whole-row hover highlight, applied via JS to every cell that shares a data-row value */
  .cell.row-hit, .timeline.row-hit { background: #EEF3FA !important; }

  .tooltip {
    position: fixed; background: #1F2933; color: white; font-size: 11.5px; padding: 8px 10px;
    border-radius: 6px; pointer-events: none; z-index: 50; display: none; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); max-width: 260px;
  }
  .tooltip b { color: #A9C6F5; }
</style>
</head>

</div>

const MONTH_W = 34;

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ if(!s) return 'N/A'; const dt=parseDate(s); return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+String(dt.getFullYear()).slice(2); }
function daysBetween(a,b){ return (b-a)/86400000; }
function monthShort(m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]; }

const rows = DATA.filter(r => r.endDate);
const fabStarts = rows.map(r=>r.fabStart).filter(Boolean).map(parseDate);
const endDates = rows.map(r=>r.endDate).filter(Boolean).map(parseDate);
const minStartYear = fabStarts.length ? Math.min(...fabStarts.map(d=>d.getFullYear())) : new Date().getFullYear();
const maxEndDate = new Date(Math.max(...endDates));
const windowStart = new Date(minStartYear, 0, 1);
let monthsNeeded = (maxEndDate.getFullYear()-windowStart.getFullYear())*12 + (maxEndDate.getMonth()-windowStart.getMonth()) + 2;
monthsNeeded = (Math.floor(monthsNeeded/12)+1)*12;
const WINDOW_MONTHS = Math.min(monthsNeeded, 48);
const windowEnd = new Date(windowStart.getFullYear(), windowStart.getMonth()+WINDOW_MONTHS, 0);
const totalDays = daysBetween(windowStart, windowEnd);
const totalWidth = WINDOW_MONTHS * MONTH_W;

const megaGrid = document.getElementById('megaGrid');

// ===== Column model: widths are mutable (Excel-style resize), left offsets derive from them =====
const COLS = [
  {key:'name',        label:'Primary',                        w:190},
  {key:'client',       label:'Client',                         w:105},
  {key:'id',           label:'Project ID',                     w:85},
  {key:'status',       label:'Project Status',                 w:92},
  {key:'endDate',      label:'Target End Date',                w:75},
  {key:'fabStart',     label:'Target Fabrication Start Date',  w:78},
  {key:'shipDate',     label:'Target Shipping Date',           w:78},
  {key:'pctComplete',  label:'% Complete',                     w:55},
];

function recomputeGridColumns(){
  let acc = 0;
  COLS.forEach((c,i)=>{
    megaGrid.style.setProperty('--fl'+i, acc+'px');
    acc += c.w;
  });
  megaGrid.style.gridTemplateColumns = COLS.map(c=>c.w+'px').join(' ') + ' repeat(' + WINDOW_MONTHS + ', ' + MONTH_W + 'px)';
}
recomputeGridColumns();

function addCell(text, classes, gridRow, gridCol){
  const d = document.createElement('div');
  d.className = classes;
  if (text !== undefined && text !== null) d.textContent = text;
  if (gridRow) d.style.gridRow = gridRow;
  if (gridCol) d.style.gridColumn = gridCol;
  megaGrid.appendChild(d);
  return d;
}

// ===== Frozen column headers (span both header rows, sticky top+left) =====
COLS.forEach((c, i)=>{
  const el = addCell(c.label, 'cell head frozen-head frozen fc'+i, null, i+1);
  const handle = document.createElement('span');
  handle.className = 'col-resizer' + (i === COLS.length-1 ? ' master-resizer' : '');
  handle.dataset.colIndex = i;
  if (i === COLS.length-1) handle.title = 'Drag to collapse the table or the chart';
  el.appendChild(handle);
});

// ===== Timeline headers: year row + month row =====
let mm = 0;
while (mm < WINDOW_MONTHS) {
  const year = windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm)/12);
  let span = 0;
  while (mm+span < WINDOW_MONTHS && (windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm+span)/12)) === year) span++;
  const startCol = COLS.length + 1 + mm;
  addCell(year, 'cell head year-head', '1', startCol + ' / span ' + span);
  mm += span;
}
for (let i=0;i<WINDOW_MONTHS;i++){
  const monDate = new Date(windowStart.getFullYear(), windowStart.getMonth()+i, 1);
  addCell(monthShort(monDate.getMonth()), 'cell head month-head', '2', String(COLS.length+1+i));
}

// Status filter options
const statuses = Array.from(new Set(rows.map(r=>(r.status||'').trim()).filter(Boolean)));
const statusSel = document.getElementById('statusFilter');
statuses.forEach(s=>{
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  statusSel.appendChild(opt);
});

function statusClass(status){
  const s = (status||'').trim().toLowerCase();
  if (s === 'completed') return 'status-completed';
  if (s === 'on hold') return 'status-onhold';
  return 'status-inprogress';
}

const tooltip = document.getElementById('tooltip');
function showTooltip(e, html){
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY + 14) + 'px';
  tooltip.innerHTML = html;
}
function hideTooltip(){ tooltip.style.display = 'none'; }

let dataRowEls = []; // for hover row highlight

function render(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const statusVal = statusSel.value;

  // remove previous data cells (everything with a data-row attr)
  megaGrid.querySelectorAll('[data-row]').forEach(el => el.remove());
  dataRowEls = [];

  let shown = 0;
  rows.forEach((r)=>{
    if (q && !(r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || (r.client||'').toLowerCase().includes(q))) return;
    if (statusVal && (r.status||'').trim() !== statusVal) return;
    const gridRowIndex = shown + 3; // rows 1-2 are headers
    shown++;
    const altClass = shown % 2 === 0 ? ' row-alt' : '';
    const rowTag = 'r' + shown;
    const rowCells = [];

    function fCell(text, colIdx, extraClass){
      const el = addCell(text, 'cell frozen fc'+colIdx+' row-hover'+altClass+(extraClass||''), String(gridRowIndex), String(colIdx+1));
      el.dataset.row = rowTag;
      rowCells.push(el);
      return el;
    }

    const nameCell = fCell(r.name, 0);
    nameCell.title = r.name;
    fCell(r.client || '—', 1);
    fCell(r.id, 2, ' id');

    const statusCell = fCell(null, 3);
    const pill = document.createElement('span');
    pill.className = 'status-pill ' + statusClass(r.status);
    pill.textContent = (r.status||'').trim() || '—';
    statusCell.appendChild(pill);

    fCell(fmtDate(r.endDate), 4);
    fCell(r.fabStart ? fmtDate(r.fabStart) : 'N/A', 5);
    fCell(r.shipDate ? fmtDate(r.shipDate) : 'N/A', 6);
    fCell(r.pctComplete!=null ? Math.round(r.pctComplete*100)+'%' : '—', 7);

    // Timeline cell (spans all month columns)
    const timeline = document.createElement('div');
    timeline.className = 'timeline row-hover'+altClass;
    timeline.style.gridRow = String(gridRowIndex);
    timeline.style.gridColumn = (COLS.length+1) + ' / span ' + WINDOW_MONTHS;
    timeline.dataset.row = rowTag;
    rowCells.push(timeline);

    const end = parseDate(r.endDate);
    const start = r.fabStart ? parseDate(r.fabStart) : null;

    if (start && end){
      const left = Math.max(0, daysBetween(windowStart, start) / totalDays * totalWidth);
      let width = daysBetween(start, end) / totalDays * totalWidth;
      width = Math.max(width, 3);
      const isOverflow = end > windowEnd;
      const clippedWidth = Math.min(width, totalWidth - left);

      const track = document.createElement('div');
      track.className = 'bar-track' + (isOverflow ? ' overflow' : '');
      track.style.left = left + 'px';
      track.style.width = clippedWidth + 'px';

      const pct = r.pctComplete != null ? r.pctComplete : 0;
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = (pct*100) + '%';
      track.appendChild(fill);

      track.addEventListener('mousemove', (e)=> showTooltip(e,
        '<b>'+r.name+'</b><br>'+r.id+'<br>'
        + (r.client ? 'Client: '+r.client+'<br>' : '')
        + 'Fab Start: '+fmtDate(r.fabStart)+'<br>'
        + 'Ship: '+(r.shipDate?fmtDate(r.shipDate):'N/A')+'<br>'
        + 'End: '+fmtDate(r.endDate)+'<br>'
        + '% Complete: '+(r.pctComplete!=null?Math.round(r.pctComplete*100)+'%':'—')
      ));
      track.addEventListener('mouseleave', hideTooltip);
      timeline.appendChild(track);

      const label = document.createElement('div');
      label.className = 'bar-name-label';
      label.textContent = r.name;
      label.style.left = (left + clippedWidth + 6) + 'px';
      timeline.appendChild(label);
    }

    megaGrid.appendChild(timeline);
    dataRowEls.push(rowCells);
  });

  document.getElementById('rowCount').textContent = shown + ' of ' + rows.length + ' projects';
}

// ===== Whole-row hover highlight across frozen + timeline cells (event delegation) =====
megaGrid.addEventListener('mouseover', (e)=>{
  const cell = e.target.closest('[data-row]');
  if (!cell) return;
  const tag = cell.dataset.row;
  megaGrid.querySelectorAll('[data-row="'+tag+'"]').forEach(el => el.classList.add('row-hit'));
});
megaGrid.addEventListener('mouseout', (e)=>{
  const cell = e.target.closest('[data-row]');
  if (!cell) return;
  const related = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-row="'+cell.dataset.row+'"]') : null;
  if (related) return; // still within the same row
  megaGrid.querySelectorAll('[data-row="'+cell.dataset.row+'"]').forEach(el => el.classList.remove('row-hit'));
});

// ===== Excel-style drag-to-resize for the 8 frozen columns, plus a master
// divider (the outer edge of the last frozen column) that drags the WHOLE
// table block at once — all the way left to collapse the table and reveal
// the full chart, or all the way right to cover the chart with the table. =====
(function initColumnResize(){
  const MASTER_IDX = COLS.length - 1;
  let activeIdx = null, isMaster = false, startX = 0, startWidth = 0, startTotal = 0, ratios = null;

  function beginDrag(handle, pageX){
    activeIdx = +handle.dataset.colIndex;
    isMaster = handle.classList.contains('master-resizer');
    startX = pageX;
    startWidth = COLS[activeIdx].w;
    if (isMaster){
      startTotal = COLS.reduce((s,c)=>s+c.w, 0);
      ratios = startTotal > 0 ? COLS.map(c=>c.w/startTotal) : COLS.map(()=>1/COLS.length);
    }
    handle.classList.add('resizing');
  }
  function applyDrag(pageX){
    if (activeIdx === null) return;
    const delta = pageX - startX;
    if (isMaster){
      // Scale every frozen column together, preserving their relative proportions,
      // so the whole block can shrink to nothing or grow to fill the view.
      const newTotal = Math.max(0, startTotal + delta);
      ratios.forEach((r,i)=>{ COLS[i].w = Math.max(0, r * newTotal); });
    } else {
      COLS[activeIdx].w = Math.max(1, startWidth + delta);
    }
    recomputeGridColumns();
  }
  function endDrag(){
    if (activeIdx === null) return;
    megaGrid.querySelectorAll('.col-resizer.resizing').forEach(h => h.classList.remove('resizing'));
    activeIdx = null;
    isMaster = false;
  }

  megaGrid.addEventListener('mousedown', (e)=>{
    const handle = e.target.closest('.col-resizer');
    if (!handle) return;
    e.preventDefault();
    beginDrag(handle, e.pageX);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', (e)=>{
    applyDrag(e.pageX);
  });
  document.addEventListener('mouseup', ()=>{
    endDrag();
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  megaGrid.addEventListener('touchstart', (e)=>{
    const handle = e.target.closest('.col-resizer');
    if (!handle) return;
    beginDrag(handle, e.touches[0].pageX);
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    if (activeIdx === null || !e.touches[0]) return;
    applyDrag(e.touches[0].pageX);
  }, {passive:true});
  document.addEventListener('touchend', endDrag);
})();

document.getElementById('searchBox').addEventListener('input', render);
statusSel.addEventListener('change', render);

render();
</script>
</body>
</html>
