<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Forecasting Report (Gantt View)</title>
<style>
  :root {
    --bg: #FAFBFC;
    --panel: #FFFFFF;
    --border: #E4E8EE;
    --border-strong: #D3D9E2;
    --text: #1F2933;
    --text-muted: #6B7280;
    --accent: #2F5FA3;
    --accent-dark: #1B3B6F;
    --accent-light: #C7D9F0;
    --orange: #C1560C;
    --status-inprogress: #2F80ED;
    --status-completed: #219653;
    --status-onhold: #DE8A1C;
    --row-h: 24px;
    --month-w: 30px;
    --head-h1: 20px;
    --head-h2: 20px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .banner {
    background: linear-gradient(90deg, #E2EFDA 0%, #DCEAD6 100%);
    padding: 8px 18px;
    border-bottom: 1px solid var(--border-strong);
    flex-shrink: 0;
  }
  .banner h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }

  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar input[type="text"] {
    padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 12px; width: 200px; outline: none; font-family: inherit;
  }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }
  .toolbar select {
    padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 12px; font-family: inherit; background: white; outline: none;
  }
  .toolbar .count { margin-left: auto; font-size: 11px; color: var(--text-muted); }
  .legend { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--text-muted); }
  .legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* ===== Two-pane layout ===== */
  .split {
    flex: 1;
    display: flex;
    min-height: 0; /* allow children to actually shrink/scroll within flex */
    background: var(--panel);
  }

  .left-pane, .right-pane {
    overflow: auto;
    position: relative;
  }
  .left-pane {
    flex: 0 0 auto;
    max-width: 62%;
    border-right: 2px solid var(--border-strong);
  }
  .right-pane {
    flex: 1 1 auto;
    min-width: 0;
  }
  /* hide the pane's own vertical scrollbar visually but keep it scrollable via JS-synced wheel;
     we still allow native vertical drag on whichever pane the user grabs */
  .left-pane::-webkit-scrollbar, .right-pane::-webkit-scrollbar { width: 14px; height: 14px; }
  .left-pane::-webkit-scrollbar-track, .right-pane::-webkit-scrollbar-track { background: #EEF1F5; }
  .left-pane::-webkit-scrollbar-thumb, .right-pane::-webkit-scrollbar-thumb { background: #A9B4C2; border-radius: 7px; border: 3px solid #EEF1F5; }
  .left-pane::-webkit-scrollbar-thumb:hover, .right-pane::-webkit-scrollbar-thumb:hover { background: #8A96A6; }
  .left-pane, .right-pane { scrollbar-width: auto; scrollbar-color: #A9B4C2 #EEF1F5; }

  .left-table {
    display: grid;
    grid-template-rows: calc(var(--head-h1) + var(--head-h2));
    grid-auto-rows: var(--row-h);
    width: max-content;
  }
  .right-table {
    display: grid;
    grid-template-rows: var(--head-h1) var(--head-h2);
    grid-auto-rows: var(--row-h);
    width: max-content;
  }

  .cell {
    display: flex; align-items: center;
    padding: 0 8px;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--panel);
  }
  .cell.id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; }
  .cell.name { font-weight: 500; }

  .head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 10px;
    line-height: 1.15;
    border-bottom: 1px solid var(--accent-dark);
    align-items: center;
    white-space: normal;
  }
  .head.year-head {
    background: #F2F2F2;
    color: #1F2933;
    justify-content: center;
    font-weight: 700;
    font-size: 10px;
    border-left: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
    top: 0;
  }
  .head.month-head {
    top: var(--head-h1);
    background: #F8F8F8;
    color: var(--orange);
    justify-content: center;
    font-weight: 700;
    font-size: 9.5px;
    border-left: 1px solid var(--border);
  }
  .left-table .head { top: 0; height: calc(var(--head-h1) + var(--head-h2)); padding: 0 8px; }

  .row-alt .cell { background: #FBFCFD; }
  .row-alt .timeline { background-color: rgba(0,0,0,0.012); }
  .row-hover:hover .cell { background: #EEF3FA; }
  .row-hover:hover .timeline { background: #F5F8FC; }

  .status-pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 9.5px; font-weight: 600; }
  .status-inprogress { background: #E4EEFC; color: var(--status-inprogress); }
  .status-completed  { background: #E1F3E8; color: var(--status-completed); }
  .status-onhold     { background: #FCEEDC; color: var(--status-onhold); }

  .timeline {
    position: relative;
    border-bottom: 1px solid var(--border);
    background: repeating-linear-gradient(
      to right, transparent, transparent calc(var(--month-w) - 1px),
      var(--border) calc(var(--month-w) - 1px), var(--border) var(--month-w)
    );
  }
  .bar-track {
    position: absolute; top: 4px; height: 16px; border-radius: 4px; overflow: visible;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08); background: var(--accent-light);
  }
  .bar-fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 4px 0 0 4px; background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%); }
  .bar-label {
    position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--text); white-space: nowrap; pointer-events: none;
  }
  .bar-track.overflow::after {
    content: "\2192"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    color: white; font-size: 11px; font-weight: 700;
  }

  .tooltip {
    position: fixed; background: #1F2933; color: white; font-size: 11.5px; padding: 8px 10px;
    border-radius: 6px; pointer-events: none; z-index: 50; display: none; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); max-width: 240px;
  }
  .tooltip b { color: #A9C6F5; }
</style>
</head>
<body>
<div id="app">
  <div class="banner">
    <h1>Portfolio Forecasting Report (Gantt View)</h1>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search project name, client, or ID&hellip;">
    <select id="statusFilter"><option value="">All statuses</option></select>
    <div class="legend">
      <span><span class="swatch" style="background:var(--accent-dark)"></span>Completed progress</span>
      <span><span class="swatch" style="background:var(--accent-light)"></span>Remaining work</span>
    </div>
    <div class="count" id="rowCount"></div>
  </div>

  <div class="split">
    <div class="left-pane" id="leftPane">
      <div class="left-table" id="leftTable"></div>
    </div>
    <div class="right-pane" id="rightPane">
      <div class="right-table" id="rightTable"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const MONTH_W = 40;

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ if(!s) return 'N/A'; const dt=parseDate(s); return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+String(dt.getFullYear()).slice(2); }
function daysBetween(a,b){ return (b-a)/86400000; }
function monthShort(m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]; }

const rows = DATA.filter(r => r.endDate);
const fabStarts = rows.map(r=>r.fabStart).filter(Boolean).map(parseDate);
const endDates = rows.map(r=>r.endDate).filter(Boolean).map(parseDate);
const minStartYear = fabStarts.length ? Math.min(...fabStarts.map(d=>d.getFullYear())) : new Date().getFullYear();
const maxEndDate = new Date(Math.max(...endDates));
const windowStart = new Date(minStartYear, 0, 1);
let monthsNeeded = (maxEndDate.getFullYear()-windowStart.getFullYear())*12 + (maxEndDate.getMonth()-windowStart.getMonth()) + 2;
monthsNeeded = (Math.floor(monthsNeeded/12)+1)*12;
const WINDOW_MONTHS = Math.min(monthsNeeded, 60);
const windowEnd = new Date(windowStart.getFullYear(), windowStart.getMonth()+WINDOW_MONTHS, 0);
const totalDays = daysBetween(windowStart, windowEnd);
const totalWidth = WINDOW_MONTHS * MONTH_W;

const leftTable = document.getElementById('leftTable');
const rightTable = document.getElementById('rightTable');
const leftPane = document.getElementById('leftPane');
const rightPane = document.getElementById('rightPane');

const FIXED_COLS = [
  {key:'name', label:'Primary', w: 200},
  {key:'client', label:'Client', w: 110},
  {key:'id', label:'Project ID', w: 90},
  {key:'status', label:'Project Status', w: 95},
  {key:'endDate', label:'Target End Date', w: 85},
  {key:'fabStart', label:'Target Fabrication Start Date', w: 95},
  {key:'shipDate', label:'Target Shipping Date', w: 95},
  {key:'pctComplete', label:'% Complete', w: 70},
];
const totalLeftWidth = FIXED_COLS.reduce((s,c)=>s+c.w,0);
leftTable.style.gridTemplateColumns = FIXED_COLS.map(c=>c.w+'px').join(' ');
rightTable.style.gridTemplateColumns = 'repeat('+WINDOW_MONTHS+', '+MONTH_W+'px)';

function addCell(text, classes, parent, styleW){
  const d = document.createElement('div');
  d.className = classes;
  if (styleW) d.style.width = styleW+'px';
  if (text !== undefined && text !== null) d.textContent = text;
  parent.appendChild(d);
  return d;
}

// ----- Left header -----
FIXED_COLS.forEach(c=>{
  addCell(c.label, 'cell head', leftTable);
});

// ----- Right header: year row + month row -----
let mm = 0;
while (mm < WINDOW_MONTHS) {
  const year = windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm)/12);
  let span = 0;
  while (mm+span < WINDOW_MONTHS && (windowStart.getFullYear() + Math.floor((windowStart.getMonth()+mm+span)/12)) === year) span++;
  const yEl = addCell(year, 'cell head year-head', rightTable);
  yEl.style.gridColumn = (mm+1) + ' / span ' + span;
  yEl.style.gridRow = '1';
  mm += span;
}
for (let i=0;i<WINDOW_MONTHS;i++){
  const monDate = new Date(windowStart.getFullYear(), windowStart.getMonth()+i, 1);
  const mEl = addCell(monthShort(monDate.getMonth()), 'cell head month-head', rightTable);
  mEl.style.gridColumn = (i+1);
  mEl.style.gridRow = '2';
}
const LEFT_HEADER_COUNT = leftTable.children.length;
const RIGHT_HEADER_COUNT = rightTable.children.length;

const statuses = Array.from(new Set(rows.map(r=>(r.status||'').trim()).filter(Boolean)));
const statusSel = document.getElementById('statusFilter');
statuses.forEach(s=>{
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  statusSel.appendChild(opt);
});

function statusClass(status){
  const s = (status||'').trim().toLowerCase();
  if (s === 'completed') return 'status-completed';
  if (s === 'on hold') return 'status-onhold';
  return 'status-inprogress';
}

const tooltip = document.getElementById('tooltip');

function render(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const statusVal = statusSel.value;

  while (leftTable.children.length > LEFT_HEADER_COUNT) leftTable.removeChild(leftTable.lastChild);
  while (rightTable.children.length > RIGHT_HEADER_COUNT) rightTable.removeChild(rightTable.lastChild);

  let shown = 0;
  rows.forEach((r)=>{
    if (q && !(r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || (r.client||'').toLowerCase().includes(q))) return;
    if (statusVal && (r.status||'').trim() !== statusVal) return;
    shown++;
    const altClass = shown % 2 === 0 ? ' row-alt' : '';

    const nameCell = addCell(r.name, 'cell name row-hover'+altClass, leftTable);
    nameCell.title = r.name;
    addCell(r.client || '\u2014', 'cell row-hover'+altClass, leftTable);
    addCell(r.id, 'cell id row-hover'+altClass, leftTable);

    const statusCell = addCell(null, 'cell row-hover'+altClass, leftTable);
    const pill = document.createElement('span');
    pill.className = 'status-pill ' + statusClass(r.status);
    pill.textContent = (r.status||'').trim() || '\u2014';
    statusCell.appendChild(pill);

    addCell(fmtDate(r.endDate), 'cell row-hover'+altClass, leftTable);
    addCell(r.fabStart ? fmtDate(r.fabStart) : 'N/A', 'cell row-hover'+altClass, leftTable);
    addCell(r.shipDate ? fmtDate(r.shipDate) : 'N/A', 'cell row-hover'+altClass, leftTable);
    addCell(r.pctComplete!=null ? Math.round(r.pctComplete*100)+'%' : '\u2014', 'cell row-hover'+altClass, leftTable);

    const timeline = document.createElement('div');
    timeline.className = 'timeline row-hover'+altClass;
    timeline.style.gridColumn = '1 / span ' + WINDOW_MONTHS;

    if (r.fabStart && r.endDate){
      const start = parseDate(r.fabStart);
      const end = parseDate(r.endDate);
      const left = Math.max(0, daysBetween(windowStart, start) / totalDays * totalWidth);
      let width = daysBetween(start, end) / totalDays * totalWidth;
      width = Math.max(width, 3);
      const isOverflow = end > windowEnd;

      const track = document.createElement('div');
      track.className = 'bar-track' + (isOverflow ? ' overflow' : '');
      track.style.left = left + 'px';
      track.style.width = Math.min(width, totalWidth - left) + 'px';

      const pct = r.pctComplete != null ? r.pctComplete : 0;
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = (pct*100) + '%';
      track.appendChild(fill);

      const label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = r.name;
      track.appendChild(label);

      track.addEventListener('mousemove', (e)=>{
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
        tooltip.innerHTML = '<b>'+r.name+'</b><br>'+r.id+'<br>'
          + (r.client ? 'Client: '+r.client+'<br>' : '')
          + 'Fab Start: '+fmtDate(r.fabStart)+'<br>'
          + 'Ship: '+(r.shipDate?fmtDate(r.shipDate):'N/A')+'<br>'
          + 'End: '+fmtDate(r.endDate)+'<br>'
          + '% Complete: '+(r.pctComplete!=null?Math.round(r.pctComplete*100)+'%':'\u2014');
      });
      track.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });

      timeline.appendChild(track);
    }
    rightTable.appendChild(timeline);
  });

  document.getElementById('rowCount').textContent = shown + ' of ' + rows.length + ' projects';
}

// ----- Sync vertical scroll between the two independently-scrolling panes -----
let syncingLeft = false, syncingRight = false;
leftPane.addEventListener('scroll', () => {
  if (syncingLeft) { syncingLeft = false; return; }
  syncingRight = true;
  rightPane.scrollTop = leftPane.scrollTop;
});
rightPane.addEventListener('scroll', () => {
  if (syncingRight) { syncingRight = false; return; }
  syncingLeft = true;
  leftPane.scrollTop = rightPane.scrollTop;
});

document.getElementById('searchBox').addEventListener('input', render);
statusSel.addEventListener('change', render);
render();
</script>
